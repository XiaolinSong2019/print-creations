services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: print_creations
      POSTGRES_USER: print_creations
      POSTGRES_PASSWORD: print_creations_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "print_creations", "-d", "print_creations"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data: