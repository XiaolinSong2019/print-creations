spring.application.name=print-creations
# Local PostgreSQL settings for compose.yaml
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/print_creations
spring.datasource.username=print_creations
spring.datasource.password=print_creations_local
# Reject decimal values for integer request fields.
spring.jackson.deserialization.accept_float_as_int=false
spring.flyway.validate-migration-naming=true
